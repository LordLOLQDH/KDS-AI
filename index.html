<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>KDS AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background-glow"></div>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">K</div>
      <div>
        <h1>KDS AI</h1>
        <p>Intelligenter KDS-Assistent</p>
      </div>
    </div>
    <div class="version" title="Aktuelle Version">v1.3</div>
  </header>
  <section class="hero">
    <div class="status-row"><span class="status-dot"></span><span>Online</span></div>
    <h2>Wie kann ich dir helfen?</h2>
    <p>Stelle eine Frage zu KDS, Leistungen, Preisen oder Angeboten.</p>
  </section>
  <section id="messages" class="messages" aria-live="polite"></section>
  <form id="chat" class="composer">
    <input id="input" autocomplete="off" placeholder="Nachricht an KDS AI …" required>
    <button type="submit">Senden</button>
  </form>
  <footer><span>KDS AI</span><span>•</span><span>Version 1.3</span></footer>
</main>
<script src="app.js"></script>
</body>
</html>
