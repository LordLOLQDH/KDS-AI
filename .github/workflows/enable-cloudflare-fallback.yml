name: Enable Cloudflare AI fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch frontend fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          endpoint = 'https://eopvkwhcgznvubesaszv.supabase.co/functions/v1/cloudflare-ai-fallback'
          if 'cloudflare-ai-fallback' in s:
              print('Fallback already present')
              raise SystemExit(0)
          s = s.replace('const ENDPOINT = "https://eopvkwhcgznvubesaszv.supabase.co/functions/v1/ai-chat-v3";', 'const ENDPOINT = "https://eopvkwhcgznvubesaszv.supabase.co/functions/v1/ai-chat-v3";\nconst FALLBACK_ENDPOINT = "' + endpoint + '";')
          helper = '''\nasync function requestFallback(message) {\n  const r = await fetch(FALLBACK_ENDPOINT, {\n    method: "POST",\n    headers: {"Content-Type": "application/json"},\n    body: JSON.stringify({message})\n  });\n  const d = await r.json();\n  if (!r.ok || !d.reply) throw new Error(d.error || `Fallback-Fehler (${r.status})`);\n  return d.reply;\n}\n'''
          marker = 'form.addEventListener("submit", async (e) => {'
          s = s.replace(marker, helper + '\n' + marker, 1)
          old = '''    if (!r.ok) {\n      pending.textContent = d.error || `Serverfehler (${r.status}).`;\n      return;\n    }'''
          new = '''    if (!r.ok) {\n      try {\n        pending.textContent = await requestFallback(message);\n      } catch (fallbackError) {\n        console.error(fallbackError);\n        pending.textContent = d.error || `Serverfehler (${r.status}).`;\n      }\n      return;\n    }'''
          s = s.replace(old, new, 1)
          old2 = '''  } catch (err) {\n    console.error(err);\n    pending.textContent = "Verbindungsfehler.";\n  }'''
          new2 = '''  } catch (err) {\n    console.error(err);\n    try {\n      pending.textContent = await requestFallback(message);\n    } catch (fallbackError) {\n      console.error(fallbackError);\n      pending.textContent = "Verbindungsfehler.";\n    }\n  }'''
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY

      - name: Commit patched frontend
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Add Cloudflare AI fallback to frontend"
          git push
